name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Setup a detached PostgreSQL database for Prisma tests
    # (If you use MySQL, change the image to 'mysql:8' and update the env vars)
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Create Test Environment Variables (.env.test)
      # Your package.json test script expects a .env.test file.
      # We construct it dynamically here with the CI database credentials.
      run: |
        echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_db" > .env.test
        echo "JWT_SECRET=super_secret_test_key_123" >> .env.test
        echo "PORT=3000" >> .env.test
        echo "NODE_ENV=test" >> .env.test

    - name: Sync Database Schema
      # Pushes your Prisma schema into the CI database so tables exist for tests
      run: npx prisma db push
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db

    - name: Run Tests
      # Executes the 'npm test' command defined in your package.json
      run: npm test